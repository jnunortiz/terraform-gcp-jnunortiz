name: Terraform CI/CD

on:
  push:
    branches:
      - dev
      - prod

env:
  GCP_WORKLOAD_ID_PROVIDER: "projects/721692020413/locations/global/workloadIdentityPools/github-actions/providers/github"
  GCP_SERVICE_ACCOUNT_EMAIL: "terraform-service-account@terraform-gcp-jnunortiz.iam.gserviceaccount.com"

jobs:
  authenticate:
    name: Authenticate to Google Cloud
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - id: 'auth'
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Capture credentials file path
        id: capture-credentials-path
        run: |
          # Capture the path of the credentials file that was created dynamically
          CREDENTIALS_FILE_PATH=$(ls /home/runner/work/terraform-gcp-jnunortiz/terraform-gcp-jnunortiz/gha-creds-*.json)
          echo "Credential file created at: $CREDENTIALS_FILE_PATH"
          echo "CREDENTIALS_PATH=$CREDENTIALS_FILE_PATH" >> $GITHUB_ENV
  
      - name: Save the credentials as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: gcp-credentials
          path: ${{ env.CREDENTIALS_PATH }}

  validate-branch:
    name: Setup Terraform
    needs: authenticate
    runs-on: ubuntu-latest
    outputs:
      BRANCH_NAME: ${{ steps.set_branch_name.outputs.BRANCH_NAME }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Display Branch Name
        run: |
          echo "**********"
          echo "Branch: $GITHUB_REF"
          echo "**********"

      - id: set_branch_name
        name: Set Branch Name
        run: |
          BRANCH_NAME=$(echo $GITHUB_REF | sed 's/refs\/heads\///')
          echo "Branch name: $BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Validate Environment
        env: 
          BRANCH_NAME: ${{ steps.set_branch_name.outputs.BRANCH_NAME }}
        run: |
          VALID_ENVS=("dev" "prod")
          if [[ ! " ${VALID_ENVS[@]} " =~ " ${BRANCH_NAME} " ]]; then
            echo "Invalid environment: $BRANCH_NAME"
            exit 1
          fi
          echo "Valid environment: $BRANCH_NAME, proceeding with Terraform steps."

  terraform-plan:
    name: Terraform Plan
    needs: validate-branch
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{needs.validate-branch.outputs.BRANCH_NAME}}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.10.5

      - name: Download GCP Credentials
        uses: actions/download-artifact@v4
        with:
          name: gcp-credentials

      - name: Set the credentials environment variable
        run: |
          CREDENTIALS_FILE_PATH=$(find $(pwd) -name 'gha-creds-*.json' | head -n 1)
          echo "Credentials file found at: $CREDENTIALS_FILE_PATH"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIALS_FILE_PATH" >> $GITHUB_ENV

      - name: Terraform Init
        run: |
          echo "Using branch name: $BRANCH_NAME"
          if [ -d "$BRANCH_NAME" ]; then
            cd $BRANCH_NAME
            terraform init
          else
            echo "Directory $BRANCH_NAME does not exist, skipping terraform init."
          fi

      - name: Terraform Plan
        run: |
          if [ -d "$BRANCH_NAME" ]; then
            cd $BRANCH_NAME
            terraform plan
          else
            echo "Directory $BRANCH_NAME does not exist, skipping terraform plan."
          fi

  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{needs.validate-branch.outputs.BRANCH_NAME}}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.10.5

      - name: Download GCP Credentials
        uses: actions/download-artifact@v4
        with:
          name: gcp-credentials

      - name: Set the credentials environment variable
        run: |
          CREDENTIALS_FILE_PATH=$(find $(pwd) -name 'gha-creds-*.json' | head -n 1)
          echo "Credentials file found at: $CREDENTIALS_FILE_PATH"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIALS_FILE_PATH" >> $GITHUB_ENV

      - name: Terraform Apply
        run: |
          if [ -d "$BRANCH_NAME" ]; then
            cd $BRANCH_NAME
            terraform apply -auto-approve
          else
            echo "Directory $BRANCH_NAME does not exist, skipping terraform apply."
          fi
