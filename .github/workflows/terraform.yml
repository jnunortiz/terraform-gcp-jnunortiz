name: Terraform CI/CD

on:
  push:
    branches:
      - dev
      - prod
  workflow_dispatch:

jobs:
  run-all:
    name: Run Terraform
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Set environment-specific secrets based on branch
      - name: Set Deployment Environment (Dev)
        if: github.ref == 'refs/heads/dev'
        run: |
          echo "DEPLOY_ENV=DEV" >> $GITHUB_ENV
          echo "GCP_WORKLOAD_ID_PROVIDER=${{ secrets.GCP_WORKLOAD_ID_PROVIDER_DEV }}" >> $GITHUB_ENV
          echo "GCP_SERVICE_ACCOUNT_EMAIL=${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL_DEV }}" >> $GITHUB_ENV

      - name: Set Deployment Environment (Prod)
        if: github.ref == 'refs/heads/prod'
        run: |
          echo "DEPLOY_ENV=PROD" >> $GITHUB_ENV
          echo "GCP_WORKLOAD_ID_PROVIDER=${{ secrets.GCP_WORKLOAD_ID_PROVIDER_PROD }}" >> $GITHUB_ENV
          echo "GCP_SERVICE_ACCOUNT_EMAIL=${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL_PROD }}" >> $GITHUB_ENV

      - name: Check Deployment Environment
        run: |
          echo "Deployment Environment: $DEPLOY_ENV"
          echo "GCP_WORKLOAD_ID_PROVIDER: $GCP_WORKLOAD_ID_PROVIDER"
          echo "GCP_SERVICE_ACCOUNT_EMAIL: $GCP_SERVICE_ACCOUNT_EMAIL"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Capture Credentials and Set GOOGLE_APPLICATION_CREDENTIALS
        run: |
          echo "Credentials file path: ${{ steps.auth.outputs.credentials_file_path }}"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${{ steps.auth.outputs.credentials_file_path }}" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.10.5

      # Set the correct .tfvars file based on the deployment environment
      - name: Set TFVARS File
        run: |
          if [ "$DEPLOY_ENV" == "DEV" ]; then
            echo "Using dev.tfvars"
            echo "TFVARS_FILE=dev.tfvars" >> $GITHUB_ENV
          elif [ "$DEPLOY_ENV" == "PROD" ]; then
            echo "Using prod.tfvars"
            echo "TFVARS_FILE=prod.tfvars" >> $GITHUB_ENV
          else
            echo "Unknown DEPLOY_ENV: $DEPLOY_ENV. Exiting."
            exit 1
          fi

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -var-file=${{ env.TFVARS_FILE }}

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file=${{ env.TFVARS_FILE }}
