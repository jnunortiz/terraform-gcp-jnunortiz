name: Terraform CI/CD

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  GCP_WORKLOAD_ID_PROVIDER: "projects/721692020413/locations/global/workloadIdentityPools/github-actions-pool/providers/github"
  GCP_SERVICE_ACCOUNT_EMAIL: "terraform-github-actions-account@terraform-gcp-jnunortiz.iam.gserviceaccount.com"

jobs:
  run-all:
    name: Run Terraform
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Capture Credentials and Set Environment Variable
        run: |
          echo "Credentials file path: ${{ steps.auth.outputs.credentials_file_path }}"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${{ steps.auth.outputs.credentials_file_path }}" >> $GITHUB_ENV

      - name: Set Branch Name
        run: |
          BRANCH_NAME=$(echo $GITHUB_REF | sed 's/refs\/heads\///')
          echo "Branch name: $BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
        

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.10.5

      - name: Terraform Init
        run: |
          # Use the branch name from environment variable
          if [ -d "$BRANCH_NAME" ]; then
            cd "$BRANCH_NAME"
            terraform init
          else
            echo "Directory $BRANCH_NAME does not exist, skipping terraform init."
          fi

      - name: Terraform Plan
        run: |
          if [ -d "$BRANCH_NAME" ]; then
            cd "$BRANCH_NAME"
            terraform plan
          else
            echo "Directory $BRANCH_NAME does not exist, skipping terraform plan."
          fi

      - name: Terraform Apply
        run: |
          if [ -d "$BRANCH_NAME" ]; then
            cd "$BRANCH_NAME"
            terraform apply -auto-approve
          else
            echo "Directory $BRANCH_NAME does not exist, skipping terraform apply."
          fi
